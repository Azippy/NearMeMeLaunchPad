[package]
name = "nearmemepad-factory"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/contract.rs"

[dependencies]
near-sdk = { version = "5.29", features = ["legacy"] }
near-contract-standards = "5.29"
schemars = "0.8"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["abi", "unit-testing"] }

